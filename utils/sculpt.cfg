#textdomain wesnoth-Era_of_Magic

#define WEAPON_SPECIAL_EOMA_SCULPT
    # wmlxgettext: [attack]
    # wmlxgettext: [specials]
    [petrifies]
        id=eoma_sculpts
        name= _ "sculpts"
        special_note={EOMA_SPECIAL_NOTES_SCULPT}
        description=_"This attack petrifies the target, turning it to stone for two turns. Units that have been petrified may not move or attack. The effect's timer starts at 2 and goes down by 1 at the end of each of the unit's own turns. Once it reaches 0, the unit is unpetrified (and slowed) at the start of its next turn. If the unit gets petrified during its own turn (by retaliation), the end of that turn already counts down the timer"+" "+{EOMA_NO_RPG}
#ifdef MULTIPLAYER
        [filter_self]
            lua_function=wesnoth.wml_conditionals.EoMa_not_rpg
        [/filter_self]
#endif
    [/petrifies]
[/specials]
# wmlindent: start ignoring
[/attack]
# wmlindent: stop ignoring

[event]
    name=attacker hits
    id=eoma_sculpt_event
    first_time_only=no
#ifdef MULTIPLAYER
    [filter_condition]
        [EoMa_not_rpg]
        [/EoMa_not_rpg]
    [/filter_condition]
#endif
    [filter_attack]
        special_id_active=eoma_sculpts
    [/filter_attack]
    #the unit must be alive
    [filter_second]
        formula="hitpoints > 0"
    [/filter_second]

    #start the timer, the petrification itself is done by the [petrifies] special right after this event
    {VARIABLE second_unit.variables.eoma_sculpt_turns_left 2}
    [unstore_unit]
        variable=second_unit
        find_vacant=no
    [/unstore_unit]
[/event]

#same as above, but for sculpting during retaliation
[event]
    name=defender hits
    id=eoma_sculpt_event2
    first_time_only=no
#ifdef MULTIPLAYER
    [filter_condition]
        [EoMa_not_rpg]
        [/EoMa_not_rpg]
    [/filter_condition]
#endif
    [filter_second_attack]
        special_id_active=eoma_sculpts
    [/filter_second_attack]

    [filter]
        formula="hitpoints > 0"
    [/filter]

    {VARIABLE unit.variables.eoma_sculpt_turns_left 2}
    [unstore_unit]
        variable=unit
        find_vacant=no
    [/unstore_unit]
[/event]

#at the start of a side's turn, unpetrify its units whose timer has run out, and slow them for that turn
[event]
    name=side turn
    id=eoma_sculpt_event3
    first_time_only=no

    [modify_unit]
        [filter]
            side=$side_number
            #only units that are still petrified, so that units unpetrified by other means don't get slowed
            status=petrified
            formula="self.wml_vars.eoma_sculpt_turns_left = 0"
        [/filter]
        [status]
            petrified=no
            slowed=yes
        [/status]
        [clear_variable]
            name=eoma_sculpt_turns_left
        [/clear_variable]
    [/modify_unit]
[/event]

#at the end of a side's turn, count down the timers of its petrified units
[event]
    name=side turn end
    id=eoma_sculpt_event5
    first_time_only=no

    [modify_unit]
        [filter]
            side=$side_number
            status=petrified
            #units with a timer of 0 are already waiting to be unpetrified at the start of their next turn
            formula="self.wml_vars.eoma_sculpt_turns_left > 0"
        [/filter]
        [set_variable]
            name=eoma_sculpt_turns_left
            sub=1
        [/set_variable]
    [/modify_unit]
[/event]

#unpetrify all sculpted units when the scenario ends
[event]
    name=scenario_end
    id=eoma_sculpt_event4
    first_time_only=no

    [modify_unit]
        [filter]
            #any unit that has a timer
            formula="self.wml_vars.eoma_sculpt_turns_left >= 0"
        [/filter]
        [status]
            petrified=no
        [/status]
        [clear_variable]
            name=eoma_sculpt_turns_left
        [/clear_variable]
    [/modify_unit]
[/event]
[+attack]
    [+specials]
        # wmlxgettext: [/specials]
        # wmlxgettext: [/attack]
#enddef